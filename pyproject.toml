[project]
name = "support-agent-orchestrator"
version = "0.1.0"
description = "Multi-tenant AI agent orchestration service built with LangGraph and FastAPI"
readme = "README.md"
authors = [
    { name = "Shashank-Prismberry", email = "shashank.pathania@prismberry.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "langchain-core>=1.8.4",
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.2,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
]


[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # Import sorting
    "UP",   # Python upgrade rules
    "B",    # Bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
]
